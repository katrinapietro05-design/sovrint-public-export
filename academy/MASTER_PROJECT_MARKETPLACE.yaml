registry: MASTER_PROJECT_MARKETPLACE
system: SOVRINT_Academy
owner: Katrina_Pietroniro
status: draft_v0_1
purpose: Canonical starter project marketplace for fellows, interns, researchers, contributors, mentors, partners, and universities.

review_rules:
  - no_confidential_access_before_review
  - no_identity_documents_at_application_stage
  - classify_scope_before_work_begins
  - preserve_lineage_and_attribution
  - public_outputs_require_review
  - sandbox_outputs_must_be_separated_from_core_material

scope_types:
  - academic
  - exploratory
  - paid
  - sponsored
  - research

access_levels:
  - public_only
  - sandbox
  - limited_internal
  - restricted

projects:
  - id: PROJECT_001
    title: SOVRINT Knowledge Graph
    track: Knowledge Engineering
    difficulty: Starter
    access_level: public_only
    duration: 2-4 weeks
    expected_outputs:
      - entity_registry
      - taxonomy_improvements
      - relationship_map
      - glossary_expansion
    portfolio_value:
      - semantic_modeling
      - knowledge_architecture
      - taxonomy_design

  - id: PROJECT_002
